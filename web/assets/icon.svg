<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quantum Draw">
  <title>Quantum Draw</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35e6d4"/>
      <stop offset=".55" stop-color="#8b6cf6"/>
      <stop offset="1" stop-color="#f062a6"/>
    </linearGradient>
    <radialGradient id="bg" cx=".28" cy=".18" r="1.05">
      <stop offset="0" stop-color="#1b1f38"/>
      <stop offset="1" stop-color="#06070d"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f062a6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f062a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Esfera de Bloch. Traço grosso de propósito: a 16px qualquer linha fina
       vira um pixel cinza e o ícone some na aba do navegador. -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#ring)" stroke-width="38"/>

  <!-- Equador inclinado: dá o volume de esfera sem custar legibilidade. -->
  <ellipse cx="256" cy="256" rx="158" ry="58" fill="none" stroke="#35e6d4"
           stroke-width="18" opacity=".85" transform="rotate(-20 256 256)"/>

  <!-- O colapso da medição. -->
  <circle cx="256" cy="256" r="84" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="42" fill="#ff7ab8"/>
</svg>
