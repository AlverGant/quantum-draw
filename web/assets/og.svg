<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35e6d4"/>
      <stop offset=".55" stop-color="#8b6cf6"/>
      <stop offset="1" stop-color="#f062a6"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b6cf6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b6cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f062a6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#f062a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#06070d"/>
  <ellipse cx="300" cy="180" rx="620" ry="440" fill="url(#halo)"/>

  <!-- marca -->
  <g transform="translate(120 195)">
    <circle cx="120" cy="120" r="96" fill="none" stroke="url(#ring)" stroke-width="23"/>
    <ellipse cx="120" cy="120" rx="96" ry="35" fill="none" stroke="#35e6d4"
             stroke-width="11" opacity=".85" transform="rotate(-20 120 120)"/>
    <circle cx="120" cy="120" r="52" fill="url(#dot)"/>
    <circle cx="120" cy="120" r="26" fill="#ff7ab8"/>
  </g>

  <g font-family="DejaVu Sans, sans-serif" fill="#e8eaf6">
    <text x="410" y="252" font-size="76" font-weight="bold" letter-spacing="-2">Quantum Draw</text>
    <text x="410" y="318" font-size="33" fill="#9aa0c0">Raffles nobody can rig.</text>
    <text x="412" y="366" font-size="33" fill="#9aa0c0">Every draw ships a proof you can check.</text>

    <g font-size="25" fill="#666d90">
      <text x="410" y="452">IBM Quantum  ·  Merkle  ·  drand</text>
    </g>
    <text x="410" y="510" font-size="27" fill="#35e6d4"
          font-family="DejaVu Sans Mono, monospace">sorteio.vynstream.com</text>
  </g>

  <rect x="0" y="614" width="1200" height="16" fill="url(#ring)"/>
</svg>
